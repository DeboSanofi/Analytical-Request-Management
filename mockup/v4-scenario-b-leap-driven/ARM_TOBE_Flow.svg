<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 730" width="1100" height="730" font-family="Arial, Helvetica, sans-serif">
<defs>
 <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a1fd6"/></marker>
 <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e6fd6"/></marker>
 <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e3f"/></marker>
 <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98200"/></marker>
 <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777"/></marker>
</defs>
<rect width="1100" height="730" fill="#ffffff"/>
<text x="30" y="34" font-size="17" font-weight="bold" fill="#1f1a4d">TO-BE flow as drawn</text>

<!-- ARM -->
<rect x="470" y="10" width="210" height="64" rx="10" fill="#ffffff" stroke="#1f1a4d" stroke-width="3"/>
<text x="575" y="35" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f1a4d">Analytical Request Management</text>
<text x="575" y="52" font-size="11" text-anchor="middle" fill="#555">Requests grid + dashboard</text>
<text x="575" y="66" font-size="11" text-anchor="middle" fill="#555">(view of status)</text>

<!-- ChemDiary -->
<rect x="30" y="120" width="170" height="80" rx="8" fill="#f1e9ff" stroke="#7a1fd6" stroke-width="2"/>
<text x="115" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#4b1a8f">ChemDiary</text>
<text x="115" y="172" font-size="11" text-anchor="middle" fill="#555">study request / results</text>

<!-- LEAP -->
<rect x="470" y="120" width="210" height="80" rx="10" fill="#1f1a4d"/>
<text x="575" y="153" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">Lab Automation</text>
<text x="575" y="173" font-size="11" text-anchor="middle" fill="#cfd3ff">(LEAP) orchestrates the flow</text>

<!-- Request / results / status -->
<path d="M200 140 H470" stroke="#7a1fd6" stroke-width="2.5" fill="none" marker-end="url(#mp)"/>
<text x="335" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#7a1fd6">Request</text>
<path d="M470 182 H200" stroke="#7a1fd6" stroke-width="2.5" fill="none" marker-end="url(#mp)"/>
<text x="335" y="200" font-size="12" font-weight="bold" text-anchor="middle" fill="#7a1fd6">Results</text>
<path d="M575 120 V74" stroke="#d98200" stroke-width="2.5" fill="none" marker-end="url(#mo)"/>
<text x="586" y="102" font-size="12" font-weight="bold" fill="#d98200">Status</text>

<!-- Instruments -->
<g>
 <rect x="880" y="380" width="190" height="80" rx="8" fill="#eaf1ff" stroke="#2e6fd6" stroke-width="2"/>
 <text x="975" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b4fa0">Instrument 1</text>
 <text x="975" y="432" font-size="11" text-anchor="middle" fill="#555">worklist format: 10p</text>
 <rect x="880" y="480" width="190" height="80" rx="8" fill="#eaf1ff" stroke="#2e6fd6" stroke-width="2"/>
 <text x="975" y="512" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b4fa0">Instrument 2</text>
 <text x="975" y="532" font-size="11" text-anchor="middle" fill="#555">worklist format: txt</text>
 <rect x="880" y="580" width="190" height="80" rx="8" fill="#eaf1ff" stroke="#2e6fd6" stroke-width="2"/>
 <text x="975" y="612" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b4fa0">Instrument 3</text>
 <text x="975" y="632" font-size="11" text-anchor="middle" fill="#555">worklist format: spl</text>
</g>
<!-- worklists -->
<path d="M680 135 H840 V400 H880" stroke="#2e6fd6" stroke-width="2.5" fill="none" marker-end="url(#mb)"/>
<path d="M680 160 H815 V500 H880" stroke="#2e6fd6" stroke-width="2.5" fill="none" marker-end="url(#mb)"/>
<path d="M680 185 H790 V600 H880" stroke="#2e6fd6" stroke-width="2.5" fill="none" marker-end="url(#mb)"/>
<text x="690" y="130" font-size="11" font-weight="bold" fill="#2e6fd6">worklists</text>
<text x="690" y="155" font-size="11" font-weight="bold" fill="#2e6fd6">worklists</text>
<text x="690" y="180" font-size="11" font-weight="bold" fill="#2e6fd6">worklists</text>

<!-- LDI -->
<rect x="240" y="290" width="480" height="415" rx="44" fill="#fbfbfd" stroke="#222" stroke-width="2.5"/>
<text x="480" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">R&amp;D Lab Data Inventory (LDI)</text>
<rect x="290" y="340" width="140" height="56" rx="6" fill="#fff" stroke="#8a2be2" stroke-width="2"/>
<text x="360" y="365" font-size="12" font-weight="bold" text-anchor="middle" fill="#5a1fa0">Catalog / index</text>
<text x="360" y="382" font-size="10" text-anchor="middle" fill="#666">metadata</text>
<rect x="380" y="430" width="260" height="90" rx="6" fill="#e8f3d6" stroke="#6a9a1f" stroke-width="2"/>
<text x="510" y="468" font-size="14" font-weight="bold" text-anchor="middle" fill="#3d5c0d">Storage (AWS)</text>
<text x="510" y="488" font-size="11" text-anchor="middle" fill="#555">raw data and results, read-only</text>
<g font-size="12" font-weight="bold" text-anchor="middle">
 <rect x="345" y="580" width="90" height="44" rx="5" fill="#fff" stroke="#c0392b" stroke-width="2"/><text x="390" y="607" fill="#c0392b">PDF</text>
 <rect x="455" y="580" width="90" height="44" rx="5" fill="#fff" stroke="#555" stroke-width="2"/><text x="500" y="607" fill="#333">JDX</text>
 <rect x="565" y="580" width="90" height="44" rx="5" fill="#fff" stroke="#555" stroke-width="2"/><text x="610" y="607" fill="#333">RPT</text>
</g>
<path d="M390 580 V520" stroke="#2e9e3f" stroke-width="2" fill="none" marker-end="url(#mg)"/><path d="M500 580 V520" stroke="#2e9e3f" stroke-width="2" fill="none" marker-end="url(#mg)"/><path d="M610 580 V520" stroke="#2e9e3f" stroke-width="2" fill="none" marker-end="url(#mg)"/>
<path d="M360 396 V430" stroke="#777" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#mk)" marker-start="url(#mk)"/>

<!-- Assistant -->
<rect x="40" y="338" width="150" height="62" rx="8" fill="#ffe3ee" stroke="#d6336c" stroke-width="2"/>
<text x="115" y="364" font-size="12" font-weight="bold" text-anchor="middle" fill="#a3174d">Assistant / chatbot</text>
<text x="115" y="382" font-size="10" text-anchor="middle" fill="#666">(pink icon in diagram: confirm)</text>
<path d="M290 368 H190" stroke="#777" stroke-width="2" fill="none" marker-end="url(#mk)"/>

<!-- LDI -> LEAP -->
<path d="M520 290 V200" stroke="#2e9e3f" stroke-width="2.5" fill="none" marker-end="url(#mg)"/>
<text x="528" y="250" font-size="11" font-weight="bold" fill="#2e9e3f">files / results read by LEAP</text>

<!-- instruments -> LDI -->
<path d="M880 440 H720" stroke="#2e9e3f" stroke-width="2.5" fill="none" marker-end="url(#mg)"/>
<text x="750" y="432" font-size="11" font-weight="bold" fill="#2e9e3f" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">XLS/TXT</text>
<path d="M880 540 H720" stroke="#2e9e3f" stroke-width="2.5" fill="none" marker-end="url(#mg)"/>
<text x="750" y="532" font-size="11" font-weight="bold" fill="#2e9e3f" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">PS</text>
<path d="M880 640 H720" stroke="#2e9e3f" stroke-width="2.5" fill="none" marker-end="url(#mg)"/>
<text x="750" y="632" font-size="11" font-weight="bold" fill="#2e9e3f" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">RPT</text>

<!-- step numbers -->
<g font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">
 <circle cx="270" cy="123" r="10" fill="#7a1fd6"/><text x="270" y="127">1</text>
 <circle cx="790" cy="118" r="10" fill="#2e6fd6"/><text x="790" y="122">2</text>
 <circle cx="1040" cy="372" r="10" fill="#2e6fd6" opacity="0"/>
 <circle cx="925" cy="470" r="10" fill="#555" opacity="0"/>
 <circle cx="745" cy="470" r="10" fill="#2e9e3f"/><text x="745" y="474">3</text>
 <circle cx="505" cy="270" r="10" fill="#2e9e3f"/><text x="505" y="274">4</text>
 <circle cx="270" cy="199" r="10" fill="#7a1fd6"/><text x="270" y="203">5</text>
 <circle cx="548" cy="97" r="10" fill="#d98200"/><text x="548" y="101">6</text>
</g>

<!-- legend -->
<g font-size="11" fill="#333">
 <text x="30" y="560" font-weight="bold">Legend</text>
 <path d="M30 575 H70" stroke="#7a1fd6" stroke-width="2.5"/><text x="78" y="579">request / results (ChemDiary)</text>
 <path d="M30 595 H70" stroke="#2e6fd6" stroke-width="2.5"/><text x="78" y="599">worklists to instruments</text>
 <path d="M30 615 H70" stroke="#2e9e3f" stroke-width="2.5"/><text x="78" y="619">data files into / out of LDI</text>
 <path d="M30 635 H70" stroke="#d98200" stroke-width="2.5"/><text x="78" y="639">status to ARM</text>
 <path d="M30 655 H70" stroke="#777" stroke-width="2"/><text x="78" y="659">catalog / assistant</text>
</g>
</svg>
